name: E2E

on:
  workflow_call:
    inputs:
      image:
        description: Judge image to run the suite in
        type: string
        default: ghcr.io/dodona-edu/dodona-assembly:latest
      ref:
        description: judge-assembly ref to test
        type: string
        default: main
  workflow_dispatch:
    inputs:
      image:
        description: Judge image to run the suite in
        type: string
        default: ghcr.io/dodona-edu/dodona-assembly:latest
      ref:
        description: judge-assembly ref to test
        type: string
        default: main

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.image }}
      options: --user root

    steps:
      - uses: actions/checkout@v7
        with:
          repository: dodona-edu/judge-assembly
          ref: ${{ inputs.ref }}
      - name: Run tests
        run: ./devel/run-tests.sh --verbose
